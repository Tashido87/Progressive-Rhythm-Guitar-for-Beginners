<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Pick / Guitar Ember Gradient -->
    <linearGradient id="pickGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Metallic Gold String Gradient -->
    <linearGradient id="goldString" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Subtle Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#ea580c" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base / App Icon Frame -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#334155" stroke-width="3" opacity="0.6" />

  <!-- Acoustic Sound Wave Concentric Circles (Subtle) -->
  <circle cx="256" cy="270" r="190" fill="none" stroke="#f97316" stroke-width="1.5" opacity="0.12" />
  <circle cx="256" cy="270" r="150" fill="none" stroke="#f97316" stroke-width="2" opacity="0.2" />
  <circle cx="256" cy="270" r="110" fill="none" stroke="#f97316" stroke-width="2" opacity="0.25" />

  <!-- Aesthetic Plectrum (Guitar Pick) Silhouette -->
  <path d="M 256 96 
           C 365 96 410 165 390 270 
           C 370 375 295 435 256 452 
           C 217 435 142 375 122 270 
           C 102 165 147 96 256 96 Z"
        fill="url(#pickGrad)"
        filter="url(#softGlow)" />

  <!-- Inner Soundhole Dark Wood Center -->
  <circle cx="256" cy="260" r="76" fill="#0f172a" />
  <circle cx="256" cy="260" r="82" fill="none" stroke="#fed7aa" stroke-width="3.5" opacity="0.85" />
  <circle cx="256" cy="260" r="90" fill="none" stroke="#ea580c" stroke-width="1.5" opacity="0.5" />

  <!-- Guitar Strings with Dynamic Vibration Node -->
  <!-- 6 Strings running through soundhole -->
  <g stroke="url(#goldString)" stroke-linecap="round">
    <!-- String 6 (E - Thickest) -->
    <line x1="210" y1="130" x2="210" y2="390" stroke-width="4.5" opacity="0.95" />
    <!-- String 5 (A) -->
    <line x1="228" y1="120" x2="228" y2="400" stroke-width="3.8" opacity="0.95" />
    <!-- String 4 (D) -->
    <line x1="246" y1="115" x2="246" y2="405" stroke-width="3.2" opacity="0.95" />
    <!-- String 3 (G) -->
    <line x1="266" y1="115" x2="266" y2="405" stroke-width="2.8" opacity="0.95" />
    <!-- String 2 (B) -->
    <line x1="284" y1="120" x2="284" y2="400" stroke-width="2.4" opacity="0.95" />
    <!-- String 1 (High E - Thinnest) -->
    <line x1="302" y1="130" x2="302" y2="390" stroke-width="2.0" opacity="0.95" />
  </g>

  <!-- Harmonic Rhythm Wave Strum Line -->
  <path d="M 175 260 Q 215 220, 256 260 T 337 260" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="4" 
        stroke-linecap="round" 
        opacity="0.9" />

  <!-- Dynamic Strum Sparkle at Soundhole Apex -->
  <circle cx="256" cy="260" r="4.5" fill="#ffffff" />
</svg>
